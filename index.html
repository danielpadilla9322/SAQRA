<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241A3A">
<title>Control de entradas | Danzas de Paucartambo: SAQRA</title>
<style>
:root{
  color-scheme:light;
  --tinta:#241A3A; --tinta2:#51476B; --gris:#857F9B; --linea:#DCD8E8; --fondo:#F2F1F7; --papel:#FFFFFF;
  --rojo:#D9381E; --rojo-t:#FBE0D9; --rojo-d:#8C200D;
  --azul:#0A7FC9; --azul-t:#D6EBF9; --azul-d:#07507F;
  --verde:#0F9150; --verde-t:#D7F0E1; --verde-d:#0A5C33;
  --maiz:#F5B400; --fucsia:#C2187A;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Semi Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --s:30px; --g:3px; --lab:30px;
  --nav:58px;
  --cinta:linear-gradient(90deg,#EC1C0C 0%,#F0782A 15%,#F2C500 30%,#8DA82A 44%,#1E9BD0 60%,#3C5FD0 73%,#8B3FA0 86%,#D61D96 100%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--tinta)}
body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--fondo);color:var(--tinta);font:400 16px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
h1,h2,h3{font-family:var(--fc);margin:0;line-height:1.15}

/* Cabecera */
.cab{background:var(--tinta);color:#fff}
.cab-in{max-width:1180px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.cab-in > div:first-child{flex:1 1 240px;min-width:0}
.cab-marca{display:flex;align-items:center;gap:12px}
.cab-logo{width:60px;height:60px;flex:none;display:block}
.cab::after{content:'';display:block;height:6px;background:var(--cinta)}
.cuenta{background:var(--maiz);color:var(--tinta);text-align:center;font:600 15px/1.2 var(--fc);padding:7px 12px;letter-spacing:.2px}
.cuenta b{font-weight:700;font-size:17px}
.cuenta.cerca{background:#C2187A;color:#fff}
.cuenta.hoy{background:var(--verde);color:#fff}
.cuenta.paso{background:#51476B;color:#fff}
.cab h1{font-size:26px;font-weight:700;letter-spacing:.2px}
.cab .sub{font:700 16px/1.2 var(--fc);letter-spacing:4px;color:var(--maiz);margin-top:2px}
.cab p{margin:3px 0 0;font-size:14px;color:#CFC8E4}
.cab-der{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:100%}
.chip{border:1px solid #6B6189;background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ok{border-color:#58D39A;color:#9EF0C6}
.chip.off{border-color:#FF9C8A;color:#FFB9AC}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--papel);border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;font:600 16px var(--fc);color:var(--gris);border-top:3px solid transparent}
.tabs button[aria-current=page]{color:var(--tinta);border-top-color:var(--tinta)}

/* Franja de ocupación */
.ocu{background:var(--papel);border-bottom:1px solid var(--linea)}
.ocu-in{max-width:1180px;margin:0 auto;padding:10px 16px}
.ocu-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#E7E4F0}
.ocu-bar i{display:block;height:100%}
.o-vendido{background:var(--tinta)} .o-reservado{background:var(--maiz)}
.o-cupo{background:repeating-linear-gradient(135deg,#fff 0 3px,#A8A2BC 3px 6px)}
.ley{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--tinta2)}
.ley li{display:flex;align-items:center;gap:6px}
.ley b{font-weight:600;color:var(--tinta);font-variant-numeric:tabular-nums}
.pt{width:12px;height:12px;border-radius:3px;border:1px solid var(--gris);flex:none}
.pt.o-libre{background:#E7E4F0;border-color:#C9C4DA}
.pt.o-vendido,.pt.o-reservado{border-color:transparent}

main{max-width:1180px;margin:0 auto;padding:0 0 calc(var(--nav) + 24px)}
body.con-sel main{padding-bottom:calc(var(--nav) + 150px)}
.pad{padding:16px}

/* Mapa */
.mbarra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--fondo);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--linea)}
.modo{display:flex;border:1.5px solid var(--tinta);border-radius:8px;overflow:hidden}
.modo button{border:0;background:var(--papel);padding:6px 14px;min-height:34px;font-weight:600;font-size:14.5px}
.modo button[aria-pressed=true]{background:var(--tinta);color:#fff}
.aviso.bloq{background:#ECEAF3;border:1.5px dashed var(--tinta2)}
.tanda{border-top:1px solid var(--linea);padding:12px 0 4px;margin-top:12px}
.tanda b{font:700 18px var(--fc)}
.tanda .det{font-size:14.5px;color:var(--tinta2)}
.tanda .accs{margin-top:8px}
.btn{border:1.5px solid var(--tinta);background:var(--papel);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.pri{background:var(--tinta);color:#fff}
.btn.pel{border-color:var(--rojo);color:var(--rojo)}
.btn.mini{padding:5px 11px;min-height:34px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:default}
.ira{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--tinta2)}
.ira button{border:0;border-radius:6px;color:#fff;font:700 14.5px var(--fc);padding:6px 11px;min-height:34px}
.ira .sA{background:var(--rojo)} .ira .sB{background:var(--azul)} .ira .sC{background:var(--verde)}
.aviso{margin:10px 16px 0;padding:9px 12px;border-radius:8px;background:#FFF4CF;border:1px solid #EBCB63;font-size:14.5px}
.mscroll{overflow-x:auto;padding:12px 8px 20px;-webkit-overflow-scrolling:touch}
.mapa{width:max-content;margin:0 auto}
.sec-tit{display:flex;gap:10px;align-items:baseline;margin:18px 0 8px;padding:5px calc(var(--lab) + var(--g));font-family:var(--fc);font-size:15px;color:var(--tinta2);position:sticky;left:0;max-width:92vw;scroll-margin-top:70px}
.sec-tit:first-child{margin-top:0}
.sec-tit > *{white-space:nowrap;flex:none}
.sec-cap{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 10px;padding:0 calc(var(--lab) + var(--g));position:sticky;left:0;max-width:92vw}
.mapa.mini .sec-cap{margin-bottom:6px}
.sec-cap .btn{font-size:13.5px;padding:4px 10px;min-height:32px}
.doc-op{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--linea)}
.doc-op > div{flex:1 1 240px}
.doc-op b{font:700 18px var(--fc);display:block}
.otros{border-top:1px solid var(--linea);padding-top:10px}
.otros summary{cursor:pointer;color:var(--tinta2);font-size:14.5px}
.cap-wrap{border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:#fff}
.cap-img{display:block;width:100%;height:auto}
.sec-tit b{font-size:19px;color:#fff;padding:1px 9px;border-radius:5px}
.sec-tit.sA b{background:var(--rojo)} .sec-tit.sB b{background:var(--azul)} .sec-tit.sC b{background:var(--verde)}
.sec-tit em{font-style:normal;font-weight:700;color:var(--tinta)}
.fila{display:grid;grid-template-columns:var(--lab) repeat(25,var(--s)) var(--lab);gap:var(--g);margin-bottom:var(--g);align-items:center}
.sep{height:calc(var(--s)*.6)}
.fl{grid-row:1;font:600 13px var(--fc);color:var(--tinta2);text-align:center;white-space:nowrap;border:0;background:none;padding:0;cursor:default;min-height:var(--s)}
.modo-bloq .mapa:not(.mini) .fl{cursor:pointer;color:var(--tinta);text-decoration:underline}
.mapa.mini .fl{pointer-events:none}
.fl:first-child{position:sticky;left:0;z-index:2;background:var(--fondo);align-self:stretch;display:grid;place-items:center;box-shadow:4px 0 0 var(--fondo),-10px 0 0 var(--fondo)}
.b{grid-row:1;width:var(--s);height:var(--s);padding:0;border:1.5px solid var(--cb);border-radius:calc(var(--s)*.34) calc(var(--s)*.34) 4px 4px;background:var(--ct);color:var(--cd);font:600 calc(var(--s)*.44)/1 var(--fc);font-variant-numeric:tabular-nums}
.b.sA{--c:var(--rojo);--ct:var(--rojo-t);--cd:var(--rojo-d);--cb:#EFA898}
.b.sB{--c:var(--azul);--ct:var(--azul-t);--cd:var(--azul-d);--cb:#8FC6EA}
.b.sC{--c:var(--verde);--ct:var(--verde-t);--cd:var(--verde-d);--cb:#8DD0AC}
.b.e-vendido{background:var(--tinta);border-color:var(--tinta);color:#fff}
.b.e-reservado{background:var(--maiz);border-color:#C28F00;color:var(--tinta)}
.b.e-cupo{background:repeating-linear-gradient(135deg,#fff 0 3px,#D5D1E2 3px 6px);border:1.5px solid var(--tinta2);color:var(--tinta)}
.b.sel{background:var(--c);border:1.5px solid #fff;color:#fff;box-shadow:0 0 0 2.5px var(--tinta)}
.b{position:relative}
.grp{grid-row:1;align-self:stretch;justify-self:stretch;margin:-2px;border:2px solid var(--mc);border-radius:8px;pointer-events:none;z-index:1;box-sizing:border-box}
.mapa.mini .grp{margin:-1px;border-width:1px;border-radius:3px}
.b.libera{outline:2px dashed #C2187A;outline-offset:1px;opacity:.6}
.b.nueva::after,.b.libera::after{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;color:#fff;font:700 12px/15px var(--fc);text-align:center;pointer-events:none;z-index:3}
.b.nueva::after{content:'+';background:var(--tinta)}
.b.libera::after{content:'\2212';background:#C2187A}
.mapa.mini .b.nueva::after,.mapa.mini .b.libera::after{display:none}
.opcion{display:block;width:100%;text-align:left;border:1.5px solid var(--linea);background:var(--papel);border-radius:10px;padding:12px 14px;margin-top:10px}
.opcion b{display:block;font:700 18px var(--fc)}
.opcion span{color:var(--tinta2);font-size:14.5px}
.adj-lista{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.adj-item{position:relative;width:96px;height:96px;border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:#fff;padding:0;display:grid;place-items:center;font-size:12px;color:var(--tinta2);text-align:center}
.adj-item img{width:100%;height:100%;object-fit:cover}
.adj-x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(36,26,58,.88);color:#fff;font-size:17px;line-height:1}
.adj-btn{display:inline-block;cursor:pointer}
.nota-imp{margin-top:8px;padding:8px 10px;border-radius:6px;background:#FCE4F1;border-left:5px solid #C2187A;color:#5B0B38;font-size:15px;line-height:1.35;font-weight:500}
.nota-imp b{display:block;font:700 12.5px var(--fc);letter-spacing:.8px;color:#C2187A}
.nota-imp.grande{font-size:16px;margin:0 0 12px}
.et.imp{background:#FCE4F1;color:#8C0E57}
.mapa.mini{cursor:pointer}
.mapa.mini .b{font-size:0;border-width:1px;border-radius:2px;pointer-events:none}
.mapa.mini .b.sel{box-shadow:0 0 0 1.5px var(--tinta)}
.mapa.mini .fl{font-size:9px}
.mapa.mini .sec-tit{font-size:13px;margin:12px 0 5px}
.mapa.mini .sec-tit b{font-size:15px}
.esc{grid-row:1;grid-column:10 / 25;text-align:center;font:600 15px var(--fc);border-radius:6px;padding:6px 0}
.esc.foso{background:#E3E0EC;color:var(--tinta2);margin-top:10px}
.esc.tabl{background:var(--tinta);color:#fff;padding:12px 0;font-size:17px;letter-spacing:1px}
.mapa.mini .esc{font-size:11px;padding:3px 0}

/* Barra de selección */
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--papel);border-top:2px solid var(--tinta);padding:10px 16px;box-shadow:0 -6px 18px rgba(36,26,58,.14)}
.selbar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.selbar .txt{flex:1 1 220px;min-width:0;font-size:14.5px;line-height:1.3}
.selbar .txt b{font:700 19px var(--fc);display:block}
.selbar .acc{display:flex;flex-wrap:wrap;gap:8px}

/* Listas y tarjetas */
.busca{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--fondo);padding:8px 0}
.busca input{flex:1 1 220px}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;border:1.5px solid #B9B3CE;border-radius:8px;padding:10px 11px;background:#fff;min-height:44px}
textarea{min-height:70px;resize:vertical}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.filtros button{flex:none;border:1.5px solid #B9B3CE;background:var(--papel);border-radius:999px;padding:5px 12px;font-size:14.5px}
.filtros button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.venta{display:block;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linea);border-left:5px solid var(--tinta);border-radius:8px;padding:11px 13px;margin-top:10px}
.venta.pend{border-left-color:var(--maiz)} .venta.anul{border-left-color:var(--gris);opacity:.7}
.venta .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.venta .cod{font:700 16px var(--fc);color:var(--tinta2)}
.venta .nom{font:600 19px var(--fc);margin:2px 0}
.venta .det{font-size:14.5px;color:var(--tinta2)}
.et{font-size:12.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:#E7E4F0;color:var(--tinta2)}
.et.ok{background:var(--verde-t);color:var(--verde-d)} .et.pend{background:#FFEBB0;color:#6B4E00} .et.mal{background:var(--rojo-t);color:var(--rojo-d)} .et.cupo{background:#E7E4F0;color:var(--tinta)}
.vacio{padding:28px 8px;text-align:center;color:var(--tinta2)}

.caja{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:16px;margin-bottom:14px}
.caja h2{font-size:21px;margin-bottom:10px}
.caja h3{font-size:17px;margin:14px 0 6px}
.caja p{margin:6px 0}
.nota{font-size:14.5px;color:var(--tinta2)}
.cifras{display:flex;flex-wrap:wrap;gap:8px 28px}
.cifras div{font-size:14.5px;color:var(--tinta2)}
.cifras strong{display:block;font:700 30px/1.1 var(--fc);color:var(--tinta);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--linea);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 14px var(--fc);color:var(--tinta2)}
tfoot td{font-weight:700;border-bottom:0}
.cupo-fila{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--linea)}
.cupo-fila .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cupo-fila input[type=number]{width:86px}
.cupo-fila select{width:auto;flex:1 1 170px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-top:1px solid var(--linea);font-size:15px}
.hist li:first-child{border-top:0}
.hist time{display:block;font-size:13px;color:var(--gris)}
.hist .cmb{display:block;font-size:14px;color:var(--tinta2);margin-top:2px}
.hist del{color:var(--rojo-d)} .hist ins{color:var(--verde-d);text-decoration:none;font-weight:600}

/* Hojas (modales) */
.velo{position:fixed;top:0;right:0;bottom:0;left:0;cursor:pointer;z-index:50;background:rgba(36,26,58,.55);display:flex;align-items:flex-end;justify-content:center}
.hoja::before{content:'';display:block;height:5px;background:var(--cinta);flex:none}
.hoja{cursor:auto;background:var(--papel);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
.hoja form{display:flex;flex-direction:column;min-height:0;flex:1}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea)}
.hoja-cab h2{font-size:22px}
.x{border:0;background:#E7E4F0;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;flex:none}
.hoja-cuerpo{padding:14px 16px;overflow-y:auto;flex:1}
.hoja-pie{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linea);background:var(--papel)}
fieldset{border:0;border-top:1px solid var(--linea);margin:14px 0 0;padding:12px 0 0}
legend{font:700 17px var(--fc);padding:0 8px 0 0}
.campo{display:block;margin-top:10px;font-size:14.5px;font-weight:500;color:var(--tinta2)}
.campo input,.campo select,.campo textarea{margin-top:3px;color:var(--tinta);font-weight:400}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ops label{position:relative}
.ops input{position:absolute;opacity:0;top:0;left:0;width:100%;height:100%;margin:0}
.ops span{display:block;border:1.5px solid #B9B3CE;border-radius:8px;padding:8px 13px;font-weight:500}
.ops input:checked + span{background:var(--tinta);border-color:var(--tinta);color:#fff}
.ops input:focus-visible + span{outline:3px solid var(--azul);outline-offset:2px}
.chk{display:flex;gap:9px;align-items:center;margin-top:12px}
.chk input{width:22px;height:22px}
.res-but{background:var(--fondo);border-radius:8px;padding:10px 12px;margin:0;font-size:15px}
.res-but b{font:700 19px var(--fc);display:block}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 0;font-weight:600}
.total output{font:700 28px var(--fc)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px}
dt{color:var(--tinta2)} dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.accs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.err{color:var(--rojo-d);font-weight:600;margin:10px 0 0}

/* Entrada (login) */
.puerta{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:20px;background:var(--tinta)}
.puerta form{background:var(--papel);border-radius:14px;padding:22px;width:100%;max-width:400px}
.puerta form{position:relative;overflow:hidden;padding-top:28px}
.puerta form::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;background:var(--cinta)}
.puerta-logo{display:block;width:132px;height:132px;margin:2px auto 10px}
.puerta h1{font-size:28px} .puerta .sub{font:700 17px/1.2 var(--fc);letter-spacing:4px;color:var(--fucsia);margin-top:2px} .puerta p{margin:6px 0 0;color:var(--tinta2);font-size:15px}
.puerta .btn{width:100%;margin-top:16px}

#toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--tinta);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;max-width:520px;box-shadow:0 6px 20px rgba(36,26,58,.3)}
.toast.error{background:var(--rojo-d)}
.toast.ok{background:var(--verde-d)}

@media (min-width:900px){
  :root{--nav:0px}
  .cab-in{padding-bottom:0}
  .tabs{position:static;height:auto;max-width:1180px;margin:0 auto;padding:6px 16px 0;background:none;border:0;display:flex;gap:4px}
  .tabs button{color:#CFC8E4;padding:10px 18px;border-top:0;border-bottom:4px solid transparent;font-size:17px}
  .tabs button[aria-current=page]{color:#fff;border-bottom-color:var(--maiz)}
  .velo{align-items:center}
  .hoja{border-radius:14px;max-height:88vh}
  .cupo-fila{grid-template-columns:200px 1fr;align-items:center}
}
@media (max-width:420px){ .cab h1{font-size:22px} .cab-logo{width:50px;height:50px} .dos{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .18s ease-out}
  @keyframes sube{from{transform:translateY(24px)}to{transform:none}}
}

// Si algo falla al cargar, el motivo aparece en pantalla en vez de quedar en blanco.
(function () {
  function mostrar(txt) {
    var d = document.getElementById('fallo');
    if (!d) {
      d = document.createElement('div'); d.id = 'fallo';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:999;background:#8C200D;color:#fff;padding:12px 14px;border-radius:8px;font:14px/1.4 system-ui,sans-serif';
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent = 'El app tuvo un error: ' + txt + '. Envía una captura de este mensaje.';
  }
  window.addEventListener('error', function (e) { if (e && e.message) mostrar(e.message + (e.lineno ? ' (línea ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; mostrar(r && r.message ? r.message : String(r)); });
})();
</script>

function resumenAsientos(ids) {
  const g = new Map();
  for (const id of [...ids].sort((a, b) => ASIENTOS[a].sector.localeCompare(ASIENTOS[b].sector) || ASIENTOS[b].orden - ASIENTOS[a].orden)) {
    const a = ASIENTOS[id], k = a.sector + '|' + a.fila;
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(a.num);
  }
  return [...g].map(([k, nums]) => {
    nums.sort((x, y) => x - y);
    const [s, f] = k.split('|'), r = [];
    for (let i = 0; i < nums.length;) {
      let j = i; while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
      r.push(j === i ? String(nums[i]) : j === i + 1 ? nums[i] + ' y ' + nums[j] : nums[i] + ' al ' + nums[j]);
      i = j + 1;
    }
    return SECTORES[s].nombre + ', fila ' + f + ': ' + r.join(', ');
  }).join('; ');
}
function calcularPrecios(ids) {
  const precios = {}; let total = 0;
  for (const id of ids) { precios[id] = ASIENTOS[id].precio; total += ASIENTOS[id].precio; }
  return { precios, total };
}

function csv(filas) {

}
async function descargar(nombre, texto) {
  // Publicada dentro de claude.ai, la página guarda archivos a través del visor.
  // En GitHub Pages (u otro sitio propio) no existe ese visor y se descarga directo.
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename: nombre, data: texto }); toast('Archivo guardado: ' + nombre, 'ok'); return; }
    } catch (e) {
      if (!e || e.code !== 'declined') toast('No se pudo guardar el archivo en este visor.', 'error');
      return;
    }
  }
  try {
    const u = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = u; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 3000);
    toast('Descargando ' + nombre);
  } catch (e) { toast('No se pudo descargar el archivo: ' + e.message, 'error'); }
}
async function copiarTexto(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { return document.execCommand('copy'); } catch (x) { return false; } finally { ta.remove(); }
  }
}

/* =====================================================================
   4. ALMACENES DE DATOS
   Ambos exponen lo mismo: txAsientos, txNumeros, actualizar, nuevoId.
   Estructura:
     asientos/{id}   -> {v: idVenta} | {p: idBloqueo} | {v: idVenta, p: idBloqueo}
                        (p = butaca bloqueada; sin registro = disponible)
     bloqueos/{id}   -> {motivo, por, uid, ts}: cada tanda de butacas bloqueadas
     ventas/{id}     -> la venta completa
     historial/{id}  -> registro de cada acción
     adjuntos/{venta}/{k}     -> {ts, por, kb}: lista liviana de comprobantes de cada venta
     comprobantes/{venta}/{k} -> {d, w, h}: la imagen (JPEG reducido); se lee solo al abrir la venta
     usuarios/{dispositivo} -> {nombre, ult}
   Todo cuelga de /g_{CÓDIGO DEL GRUPO}/ (ver reglas de Firebase).
     numeros/n{N}    -> idVenta: reserva de cada N.º de venta (evita repetidos; no se reutiliza)
   ===================================================================== */
function almacenFirebase(fdb, raiz, alCambiar) {
  const R = ruta => fdb.ref(raiz + '/' + ruta);
  const cache = { asientos: {}, ventas: {}, historial: {}, usuarios: {}, bloqueos: {}, adjuntos: {} };
  const oir = (clave, ref) => ref.on('value', s => { cache[clave] = s.val() || {}; alCambiar(cache); },
    e => toast('No se pudo leer "' + clave + '": ' + e.message, 'error'));
  oir('asientos', R('asientos'));
  oir('ventas', R('ventas'));
  oir('historial', R('historial').limitToLast(600));
  oir('usuarios', R('usuarios'));
  oir('bloqueos', R('bloqueos'));
  oir('adjuntos', R('adjuntos'));
  fdb.ref('.info/connected').on('value', s => { EN_LINEA = !!s.val(); pintarChips(); });
  return {
    async txAsientos(fn) { const r = await R('asientos').transaction(cur => fn(cur || {})); return !!r.committed; },
    async txNumeros(fn) { const r = await R('numeros').transaction(cur => fn(cur || {})); return !!r.committed; },
    async actualizar(obj) { await fdb.ref(raiz).update(obj); },
    async leer(ruta) { const sn = await R(ruta).get(); return sn.val(); },
    nuevoId() { return R('historial').push().key; }
  };

function estadoAsiento(id) {

    for (const o of [sec[a.sector], tot]) {

      if (r && r.p) o.cupoTotal++;
      if (e.e === 'libre') o.libres++;
      else if (e.e === 'cupo') o.cupoLibre++;
      else if (e.e === 'reservado') { o.reservadas++; o.porCobrar += precioDe(e.venta, a.id); }

    const n = asientosDe(v).length, pend = v.pago && v.pago.estado === 'pendiente';
    const km = (v.pago && v.pago.medio) || 'Sin registrar';
    if (!medio[km]) medio[km] = { entradas: 0, cobrado: 0, porCobrar: 0 };

function soltar(cur, ids, idVenta) {

// Reduce la foto o captura (máx. 1400 px por lado, JPEG) para que pese unos 100 a 300 KB
async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se pudo leer la imagen. Prueba con otra foto o captura.')); i.src = url; });
    let lado = 1400, calidad = 0.72, d, w, h;
    for (let intento = 0; intento < 4; intento++) {
      const e = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
      w = Math.max(1, Math.round(img.naturalWidth * e)); h = Math.max(1, Math.round(img.naturalHeight * e));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      d = cv.toDataURL('image/jpeg', calidad);
      if (d.length * 0.75 <= 300 * 1024) break;
      lado = Math.round(lado * 0.8); calidad = Math.max(0.5, calidad - 0.07);

    return { d, w, h, kb: Math.round(d.length * 0.75 / 1024) };
  } finally { URL.revokeObjectURL(url); }
}

const codigoDe = n => 'V-' + String(n).padStart(4, '0');

// Reserva un N.º de venta. Si el número era el sugerido (auto) y otra persona ya lo tomó, toma el siguiente libre.

const CAMPOS = [
  ['num', 'N.º de venta', v => v ? codigoDe(v) : ''], ['nota', 'Nota importante'],
  ['comprador.nombre', 'Comprador'], ['comprador.doc', 'DNI'], ['comprador.tel', 'Teléfono'],

  ['canal', 'Canal', v => CANALES[v] || v],

async function guardarVenta(id, nueva, accion, opc) {
  const antes = S.ventas[id], cambios = [];
  for (const [ruta, nombre, fmt] of CAMPOS) {
    const a = leer(antes, ruta), d = leer(nueva, ruta);
    if (String(a == null ? '' : a) !== String(d == null ? '' : d))
      cambios.push({ campo: nombre, antes: fmt ? fmt(a) : String(a == null ? '' : a), despues: fmt ? fmt(d) : String(d == null ? '' : d) });
  }

  const ahora = Date.now();
  if (nueva.pago.estado === 'pagado' && antes.pago && antes.pago.estado === 'pendiente') nueva.pago.fecha = ahora;
  if (nueva.pago.estado === 'pendiente') nueva.pago.fecha = null;
  if (nueva.entrega.hecha && !(antes.entrega && antes.entrega.hecha)) nueva.entrega.fecha = ahora;
  if (!nueva.entrega.hecha) nueva.entrega.fecha = null;

}

function construirMapa() {
  let h = '';

    const sc = SECTORES[blq.sector];

    for (const f of blq.filas) {
      if (!f) { h += '<div class="sep"></div>'; continue; }
      let c = '';
      for (const [col, n0, cant] of f[1]) for (let i = 0; i < cant; i++)
        c += `<button type="button" class="b s${blq.sector}" style="grid-column:${col + i + blq.off + 1}" data-c="${col + i + blq.off + 1}" data-id="${blq.sector}-${f[0]}-${n0 + i}">${n0 + i}</button>`;

    }
  }

  const m = $('#mapa'); m.innerHTML = h;
  // En vista completa las butacas son muy pequeñas para tocarlas: el toque acerca la zona.
  $('#mscroll').addEventListener('click', e => {
    if (e.target.closest('[data-a]')) return;
    if (m.classList.contains('mini')) {
      let mejor = null, dist = 1e9;
      for (const b of $$('.b', m)) { const r = b.getBoundingClientRect(); const d = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY); if (d < dist) { dist = d; mejor = b; } }
      acercar(mejor); return;
    }
    const b = e.target.closest('.b');
    if (b) { tocarButaca(b.dataset.id); return; }
    const fl = e.target.closest('.fl');
    if (fl) tocarFila.apply(null, fl.dataset.fila.split('|'));
  });
}
function ajustarZoom() {
  const m = $('#mapa'), cont = $('#mscroll');

  else {
    g = cw < 760 ? 1 : 3; lab = cw < 760 ? 20 : 30;
    s = Math.max(8, Math.min(34, Math.floor((cw - 2 * lab - 26 * g) / 25)));
  }
  m.style.setProperty('--s', s + 'px'); m.style.setProperty('--g', g + 'px'); m.style.setProperty('--lab', lab + 'px');
  const mini = s < 22;

const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  else if (m.tipo === 'detalle') { if (!S.ventas[m.id]) return cerrar(); h = hojaDetalle(m.id); }
  else if (m.tipo === 'anular') h = hojaAnular(m.id);
  else if (m.tipo === 'confirmar') h = hojaConfirmar(m);
  else if (m.tipo === 'usuario') h = hojaUsuario();
  else if (m.tipo === 'bloquear') h = hojaBloquear(m);
  else if (m.tipo === 'texto') h = hojaTexto(m);
  else if (m.tipo === 'imagen') h = hojaImagen(m);
  else if (m.tipo === 'archivo') h = hojaArchivo(m);
  else if (m.tipo === 'cambio') { if (!S.ventas[m.id]) return cerrar(); h = hojaCambio(m.id); }
  else if (m.tipo === 'nota') { if (!S.ventas[m.id]) return cerrar(); h = hojaNota(m); }
  const cuerpo = $('#modal .hoja-cuerpo'), y = cuerpo ? cuerpo.scrollTop : 0;

let enCurso = 0; // operaciones propias en marcha: mientras duran no se depura la selección
async function intentar(fn, okMsg, boton) {
  if (boton) boton.disabled = true;
  enCurso++;
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r === undefined ? true : r; }
  catch (e) { toast(e.message || String(e), 'error'); return false; }
  finally { enCurso--; if (boton && boton.isConnected) boton.disabled = false; }
}
function limpiarSel() { UI.sel.clear(); UI.selTipo = null; }
function tocarButaca(id) {
  const e = estadoAsiento(id);
  const alternar = () => { if (UI.sel.has(id)) UI.sel.delete(id); else UI.sel.add(id); if (!UI.sel.size) UI.selTipo = null; pintarMapa(); pintarSeleccion(); };
  if (UI.reubicar) {
    if (e.vid === UI.reubicar || e.e === 'libre' || e.e === 'cupo') alternar();
    else toast('Esa butaca ya está ocupada.');
    return;
  }
  if (e.vid) { abrir({ tipo: 'detalle', id: e.vid }); return; }
  const tipo = e.e === 'cupo' ? 'cupo' : 'libre';
  if (UI.modo === 'vender' && tipo === 'cupo') { toast('Butaca bloqueada (' + motivoDe(id) + '). Para venderla o desbloquearla, pasa a "Bloquear".'); return; }
  if (UI.sel.size && UI.selTipo !== tipo && !UI.sel.has(id)) { toast('Elige por separado las butacas libres y las bloqueadas.'); return; }
  UI.selTipo = tipo; alternar();
}
// En modo bloqueo, la letra de la fila elige (o suelta) la fila completa.
function tocarFila(sector, fila) {
  if (UI.reubicar || UI.modo !== 'bloquear') return;
  const ids = LISTA.filter(a => a.sector === sector && a.fila === fila).map(a => a.id);
  const tipo = UI.sel.size ? UI.selTipo : (ids.some(id => estadoAsiento(id).e === 'libre') ? 'libre' : 'cupo');
  const aptas = ids.filter(id => estadoAsiento(id).e === tipo);
  if (!aptas.length) { toast('En la fila ' + fila + ' no hay butacas ' + (tipo === 'libre' ? 'libres' : 'bloqueadas') + '.'); return; }
  const todas = aptas.every(id => UI.sel.has(id));
  for (const id of aptas) { if (todas) UI.sel.delete(id); else UI.sel.add(id); }
  UI.selTipo = UI.sel.size ? tipo : null;
  pintarMapa(); pintarSeleccion();
}

}

  firebase.initializeApp(FIREBASE_CONFIG);
  const fdb = firebase.database();
  // 1. Código del grupo: se comprueba contra la base de datos antes de entrar.
  let codigo = AJ.get('codigo');
  for (;;) {
    if (!codigoValido(codigo)) {
      codigo = await pedir(`<p>Para entrar necesitas el código del grupo. Lo más fácil es abrir el enlace privado que se compartió en el grupo; si no, pégalo aquí.</p>${aviso ? '<p class="aviso" style="margin:12px 0 0">' + esc(aviso) + '</p>' : ''}
        <label class="campo">Código del grupo<input type="text" name="codigo" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <button class="btn pri">Continuar</button>`, f => {
        const v = f.elements.codigo.value.trim();
        if (!codigoValido(v)) throw new Error('Ese código no es válido. Cópialo tal como se envió en el grupo.');
        AJ.set('codigo', v); return v;
      });
      aviso = '';
    }
    try { await fdb.ref('g_' + codigo + '/usuarios').get(); break; }
    catch (e) {
      if (/permission|denied/i.test(String((e && (e.code || e.message)) || ''))) { AJ.del('codigo'); codigo = null; aviso = 'Ese código no da acceso. Revisa que sea el del enlace del grupo.'; continue; }
      await pedir(`<p class="err">No se pudo conectar con la base de datos: ${esc((e && e.message) || e)}</p><button class="btn pri">Reintentar</button>`, () => true);
    }
  }
  // 2. Nombre de la persona (queda como responsable de lo que registre)
  let nombre = AJ.get('nombre');
  if (!nombre) nombre = await pedir(`<p>Escribe tu nombre: es el que queda como responsable de cada venta o cambio que registres.</p>
    <label class="campo">Tu nombre<input type="text" name="nombre" required autocomplete="off" autocapitalize="words" enterkeyhint="go"></label>
    <button class="btn pri">Entrar</button>`, f => {
    const n = f.elements.nombre.value.trim(); if (!n) throw new Error('Escribe tu nombre.');
    AJ.set('nombre', n); return n;
  });
  U = { uid: idDispositivo(), nombre };
  almacen = almacenFirebase(fdb, 'g_' + codigo, alCambiarDatos);
  almacen.actualizar({ ['usuarios/' + U.uid]: { nombre, ult: Date.now() } }).catch(() => {});
  montar();
}
// Ícono de la pestaña y de la pantalla de inicio del teléfono (con el logo)
cargarLogo().then(img => {
  if (!img) return;
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.type = 'image/png'; ic.href = LOGO_URI; document.head.appendChild(ic);
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 180; const g = cv.getContext('2d');
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 180, 180); g.drawImage(img, 14, 14, 152, 152);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = cv.toDataURL('image/png'); document.head.appendChild(ap);
  } catch (e) { /* sin ícono de inicio */ }
});
// La tipografía se pide después de mostrar la página: si no hay red, el app abre igual.

  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap';
  document.head.appendChild(l);
})();
iniciar().catch(e => {
  $('#app').innerHTML = `<div class="puerta"><form><h1>No se pudo iniciar</h1><p>${esc(e.message)}</p></form></div>`;
});
